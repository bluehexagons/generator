<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b10" />
    <title>Plasma Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <canvas id="main" aria-label="Animated plasma artwork. Tap to randomize, drag to scrub the seed, or swipe to change modes."></canvas>

    <div class="ambient-grain" aria-hidden="true"></div>

    <div class="top-bar">
      <header class="hud top-left">
        <div class="eyebrow">
          <span class="title"><i class="title-mark" aria-hidden="true"></i>Plasma Generator</span>
          <span id="playback-state" class="playback-state"><i></i> playing</span>
        </div>
        <div class="mode-line">
          <h1 id="mode-name" class="mode-name" aria-live="polite">—</h1>
          <span id="mode-count" class="mode-count">— / —</span>
        </div>
        <p id="mode-note" class="mode-note">—</p>
        <div class="seed-row">
          <span class="label">seed</span>
          <code id="seed-readout">—</code>
          <input id="seed-input" type="text" aria-label="Set seed between 0 and 1" placeholder="set 0–1" inputmode="decimal" />
        </div>
      </header>

      <div class="hud top-right" aria-label="Artwork actions">
        <button id="btn-random" title="New seed (R)"><span class="button-icon" aria-hidden="true">✦</span><span class="button-label">Randomize</span></button>
        <button id="btn-save" title="Download PNG (S)"><span class="button-icon" aria-hidden="true">↓</span><span class="button-label">Save</span></button>
        <button id="btn-share" title="Copy deep link"><span class="button-icon" aria-hidden="true">↗</span><span class="button-label">Share</span></button>
        <button id="btn-settings" class="settings-button" aria-label="Open controls" aria-controls="panel-right" aria-expanded="false" title="Open controls"><span aria-hidden="true">☷</span><span class="button-label">Controls</span></button>
      </div>
    </div>

    <div id="panel-scrim" class="panel-scrim" aria-hidden="true"></div>
    <aside class="hud right" id="panel-right" aria-label="Generator controls">
      <div class="panel-heading">
        <span>Controls</span>
        <button id="btn-close-settings" class="close-button" aria-label="Close controls">×</button>
      </div>

      <section class="control-section" aria-labelledby="motion-heading">
        <div class="section-heading" id="motion-heading">Motion</div>
        <div class="control">
          <label for="drift">Speed <span id="drift-out">1×</span></label>
          <input id="drift" type="range" min="-100" max="100" step="1" />
          <div class="range-ends" aria-hidden="true"><span>reverse</span><span>still</span><span>forward</span></div>
        </div>
        <div class="control">
          <label for="cycle-rate">Scene duration <span id="cycle-rate-out">6 sec</span></label>
          <input id="cycle-rate" type="range" min="3" max="15" step="1" />
        </div>
      </section>

      <section class="control-section" aria-labelledby="look-heading">
        <div class="section-heading" id="look-heading">Appearance</div>
        <div class="control">
          <label for="pixel-size">Pixel size <span id="pixel-size-out">2</span></label>
          <input id="pixel-size" type="range" min="1" max="40" step="1" />
        </div>
        <div class="control">
          <label for="palette">Palette</label>
          <select id="palette" aria-label="Color palette"></select>
        </div>
      </section>

      <div class="gesture-hint"><span aria-hidden="true">↔</span> Drag the artwork to scrub. Swipe on touch to change scenes.</div>
      <div class="hint">
        <kbd>←</kbd>/<kbd>→</kbd> scene · <kbd>R</kbd> seed · <kbd>Space</kbd> play ·
        <kbd>C</kbd> cycle · <kbd>S</kbd> save · <kbd>F</kbd> controls
      </div>
    </aside>

    <div class="bottom-deck">
      <div class="hud transport" aria-label="Playback controls">
        <div class="transport-buttons">
          <button id="btn-prev" class="icon-button" aria-label="Previous scene" title="Previous scene (←)">‹</button>
          <button id="btn-pause" class="play-button" aria-label="Pause animation" aria-pressed="false" title="Pause animation (Space)"><span class="button-icon" aria-hidden="true">Ⅱ</span><span class="button-label">Pause</span></button>
          <button id="btn-next" class="icon-button" aria-label="Next scene" title="Next scene (→)">›</button>
        </div>
        <button id="btn-cycle" class="cycle-button" aria-pressed="false" title="Auto-cycle scenes (C)"><span class="button-icon" aria-hidden="true">↻</span><span class="button-label">Auto</span></button>
        <div class="cycle-meter" aria-hidden="true"><span id="cycle-progress"></span></div>
      </div>
      <nav id="gallery" class="hud gallery" aria-label="Render scenes"></nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
