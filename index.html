<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plasma Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="script.js" defer></script>
  </head>
  <body>
    <canvas id="main" title="Click to randomize"></canvas>

    <header class="hud top-left">
      <div class="title">Plasma Generator</div>
      <div id="mode-name" class="mode-name">—</div>
      <div id="mode-note" class="mode-note">—</div>
      <div class="seed-row">
        <span class="label">seed</span>
        <code id="seed-readout">—</code>
        <input id="seed-input" type="text" placeholder="set 0–1" inputmode="decimal" />
      </div>
    </header>

    <div class="hud top-right">
      <button id="btn-prev" title="Previous mode (←)">‹</button>
      <button id="btn-next" title="Next mode (→)">›</button>
      <button id="btn-random" title="New seed (R)">Randomize</button>
      <button id="btn-pause" title="Pause animation (Space)">Pause</button>
      <button id="btn-cycle" title="Auto-cycle modes (C)">Cycle</button>
      <button id="btn-save" title="Download PNG (S)">Save PNG</button>
      <button id="btn-share" title="Copy deep link">Copy link</button>
    </div>

    <aside class="hud right">
      <div class="control">
        <label for="pixel-size">Pixel size <span id="pixel-size-out">1</span></label>
        <input id="pixel-size" type="range" min="1" max="40" step="1" />
      </div>
      <div class="control">
        <label for="drift">Animate seed <span id="drift-out">off</span></label>
        <input id="drift" type="range" min="-100" max="100" step="1" />
      </div>
      <div class="hint">
        Keys: <kbd>←</kbd>/<kbd>→</kbd> mode · <kbd>0</kbd>–<kbd>9</kbd> jump ·
        <kbd>R</kbd> seed · <kbd>Space</kbd> pause · <kbd>C</kbd> cycle · <kbd>S</kbd> save
      </div>
    </aside>

    <nav id="gallery" class="hud bottom" aria-label="render modes"></nav>
  </body>
</html>
